<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark backdrop with rounded corners -->
  <rect width="100" height="100" rx="22" fill="#000000" />
  
  <!-- Glowing neon green bezel border -->
  <rect x="4" y="4" width="92" height="92" rx="18" fill="none" stroke="#6bee18" stroke-width="4.5" stroke-linecap="round" />
  
  <!-- Monogram Initials (RC) -->
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" text-anchor="middle">
    <!-- 'R' in clean white -->
    <text x="36" y="61" font-size="38" fill="#ffffff">R</text>
    
    <!-- 'C' in vibrant neon green -->
    <text x="64" y="61" font-size="38" fill="#6bee18">C</text>
  </g>
  
  <!-- Sleek cursor bar detail under the monogram -->
  <line x1="42" y1="74" x2="58" y2="74" stroke="#6bee18" stroke-width="3" stroke-linecap="round" />
</svg>